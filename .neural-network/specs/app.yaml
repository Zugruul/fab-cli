invariants:
- Every game-fact answer must derive from retrieved corpus chunks; emitted citations must be validated against the actually-retrieved set; when grounding is insufficient the app must abstain and point to the judge Discord
- Card legality (bans, Living Legend, restricted lists) must never be served from model weights or static indexes as current truth — fetch the live policy when online; when offline, label legality claims as potentially stale with the last-known date.
- Every shipped artifact (model, embedder, detector, index, registry) must be versioned and pinned via manifests to a corpus snapshot and its compatible peers, with its license identifier recorded; the app must refuse mismatched artifact combinations; knowledge provenance ("knowledge up to") must always be user-visible.
- Never mix content from any other card game into the corpus, datasets, models, indexes, or answers.
- The app is offline-first with no accounts and no required server; core Q&A/scan/catalog work with no network; the user's collection never leaves the device except by an explicit user share action, and collection contents are never sent to analytics.
- No official card images are redistributed inside shipped app binaries or downloadable artifacts; card images load at runtime from official/community CDNs and may be cached. Training-time use of downloaded images on the training host is permitted but images are never committed to git nor shipped.
- The corpus->dataset->train->quantize->eval->release pipeline must be reproducible from committed manifests (corpus snapshot hash, dataset config, base model hash, hyperparameters, seeds, environment capture, eval scores); no model ships without its manifest.
- No model or knowledge pack is released without passing the eval gate - trichotomy scoring with asymmetric penalties, near-zero incorrect on adjudication-critical categories, a per-suite minimum-correct coverage floor, OOD rejection suite green, the human-authored adjudication suite green, and (for major versions) a human-audited sample.
- Every ML component shipped in app binaries or downloadable artifacts must carry a license clean for public App Store distribution (Apache 2.0/MIT preferred); no non-commercial, research-only, or copyleft (GPL/AGPL) weights or code ship. Corpus text ships only in the mode recorded by the redistribution assessment.
- All merge-gating tests must pass with the network disabled; live HTTP happens only behind explicit user actions or the artifact updater, never in the gate.
