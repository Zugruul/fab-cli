# yaml-language-server: $schema=https://raw.githubusercontent.com/Zugruul/development-skills/main/plugins/spec-workflow/schemas/project-config.schema.json#/properties/specs/items
id: price
title: Marketplace price comparison
board: main
specPath: fab-cli/SPEC-PRICE.md
backlogPath: fab-cli/docs/BACKLOG-PRICE.md
taskPrefix: PRICE
epics:
- id: E0
  title: 'Foundations: providers & clients'
  taskRanges:
  - - 1
    - 9
  blockedBy: []
- id: E1
  title: Comparison engine + card command
  taskRanges:
  - - 10
    - 19
  blockedBy:
  - epic: E0
    untilStatus: Deployed
- id: E2
  title: Export + CSV pages
  taskRanges:
  - - 20
    - 29
  blockedBy:
  - epic: E1
    untilStatus: Deployed
- id: EI
  title: Infra reserve
  taskRanges:
  - - 90
    - 99
  blockedBy: []
invariants:
- Marketplace access is keyless — never require, store, or ship TCGplayer/Cardmarket API credentials; no auth command exists in the price-comparison namespace.
- Keep concurrency ≤4 per external host with retry/backoff; a 403 from mp-search-api is rate-limiting/bot protection — degrade to market-price fallback, never hammer or retry-storm.
- All merge-gating tests run with the network disabled; live HTTP happens only behind explicit user commands.
- Every price cell that is not an exact per-condition value carries a source label saying where it came from (adjacent:<COL>, market, trend, low); no unlabeled fallback number ever reaches output.
- Ratio cells are computed only from prices converted to one common currency with a dated ECB rate recorded in the output; never divide raw USD by raw EUR.
- Never scrape Cloudflare-protected Cardmarket pages or spoof authenticated browser sessions; only public keyless endpoints.
- Unmatched or unpriced rows are reported (unmatched.csv / summary), never silently dropped.
