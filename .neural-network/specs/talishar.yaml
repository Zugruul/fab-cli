board: main
specPath: fab-cli/SPEC-TALISHAR.md
backlogPath: fab-cli/docs/BACKLOG-TALISHAR.md
taskPrefix: TAL
epics:
- id: E0
  title: Vendoring & fork plumbing
  taskRanges:
  - - 1
    - 9
  blockedBy: []
- id: E1
  title: Architecture doc + talishar brain
  taskRanges:
  - - 10
    - 19
  blockedBy:
  - epic: E0
    untilStatus: Deployed
- id: E2
  title: Card implementation pipeline
  taskRanges:
  - - 20
    - 29
  blockedBy:
  - epic: E1
    untilStatus: Deployed
- id: E3
