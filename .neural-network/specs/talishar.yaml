invariants:
- Never open, mark ready, approve, or merge pull requests on Talishar org repositories; tooling pushes branches only to the user's forks and prepares PR title/body as text — a human creates every upstream PR.
- In every vendored Talishar clone, `origin` must be the user's fork and `upstream` the Talishar org repo, fetch-only; nothing is ever pushed to `upstream`, and a diverged fork main is reported, never force-pushed.
- third_party/talishar* clones are gitignored; their contents — especially copyrighted card images — are never committed to fab-cli. Image processing is transient and its outputs go only to branches of the Talishar-side repos.
- Card behavior implementations are derived from live Card Vault true text plus the-fab-cube stats and the CR at implementation time — never from remembered card text.
- The talishar brain links to card-vault entities for card/keyword facts and is never added to the keyword-sync MIRRORS list; engine knowledge lives in the talishar brain only.
- All merge-gating tests pass with the network disabled and without the vendored clones present; running the Talishar docker stack or hitting talishar.net/images.talishar.net is only ever user-invoked, never in the gate.
- Upstream contributions stay incremental and convention-following (feat:/fix: titles, Summary + Test plan bodies, coordination via the Talishar Discord for large changes); no engine rewrite.
