  area: permissions
  severity: medium
  summary: Force-push denial made history corrections require replacement branches,
    causing superseded-PR churn
  generalized: When the permission layer denies force-push, history corrections need
    the replacement-branch pattern (new branch, new PR, close old with pointer); a
    first-class 'rebuild branch' helper would cut the PR churn and reviewer confusion
