  generalized: Board issue bodies should embed each task's full backlog block (description,
    dependencies, acceptance criteria, spec citations) plus an artifacts/references
    section with the backlog marked authoritative — pointer-only bodies force humans
    off the board to read anything.
  detail: Seeder upgraded mid-session (task_block extraction); all previously seeded
    issues re-patched to the thorough format.
  evidence: []
