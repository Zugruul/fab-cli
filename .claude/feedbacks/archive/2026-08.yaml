  area: board
  severity: high
  summary: Chained board moves in one shell command bypassed a blocked QA gate and
    reached Deployed
  generalized: 'Board-move commands must not be chained unconditionally in one shell
    invocation: a blocked transition exits nonzero but later chained moves still run,
    silently skipping the gate. Move one status at a time and check each result —
    or the move script should refuse status-skipping outright.'
  detail: A QA-gate hook block (missing labeled review passes) was followed by chained
