    roster — finished agents from earlier segments stay registered as active and can
    deadlock any automation that treats the roster as ground truth; orchestrators
    should read the on-disk team config for exact member names (never guess name patterns)
    and formally shut down stale members at segment boundaries, and the harness should
    auto-terminate in-process teammates when their spawning segment ends.
  routing:
