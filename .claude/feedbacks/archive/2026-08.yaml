    cherry-picks.
  evidence:
  - fab-cli#120
  routing:
    action: brain-note
    ref: orchestrator/replacement-branch-instead-of-force-push
- category: incident
  area: board
  severity: high
  summary: Chained board moves in one shell command bypassed a blocked QA gate and
    reached Deployed
  generalized: 'Board-move commands must not be chained unconditionally in one shell
    invocation: a blocked transition exits nonzero but later chained moves still run,
    silently skipping the gate. Move one status at a time and check each result —
    or the move script should refuse status-skipping outright.'
  detail: A QA-gate hook block (missing labeled review passes) was followed by chained
    Ready and Deployed moves that succeeded; state was reverted, passes recorded,
    then advanced properly.
  evidence:
  - fab-cli#120
  routing:
    action: brain-note
    ref: orchestrator/no-chained-board-moves
- category: recommendation
  area: board
  severity: medium
  summary: Seeded issue bodies should embed the full backlog block plus artifacts,
    not a pointer line
  generalized: Board issue bodies should embed each task's full backlog block (description,
    dependencies, acceptance criteria, spec citations) plus an artifacts/references
    section with the backlog marked authoritative — pointer-only bodies force humans
    off the board to read anything.
  detail: Seeder upgraded mid-session (task_block extraction); all previously seeded
    issues re-patched to the thorough format.
  evidence: []
  routing:
    action: upstream
    ref: development-skills seed-board.sh task_block embedding (implemented this session,
