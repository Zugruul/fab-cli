# yaml-language-server: $schema=https://raw.githubusercontent.com/Zugruul/development-skills/main/plugins/spec-workflow/schemas/project-config.schema.json
schemaVersion: 2
project:
    name: fab-cli
    description: TypeScript CLI for the Flesh & Blood TCG — fabrary.net deck/card/meta search, fabtcg.com tournament coverage, lore + official-rules knowledge bases
    mainBranch: main
    branchPattern: fab/<id>-<slug>
boards:
-   id: main
    provider: github-project
    owner: Zugruul
    repo: Zugruul/fab-cli
    projectNumber: 4
    projectId: PVT_kwHOAL1A3M4Bc3Ze
    fields:
        status:
            fieldId: PVTSSF_lAHOAL1A3M4Bc3ZezhXdFmY
            options:
                Backlog: 3cf5d510
                In progress: d9e7b786
                In review: f48a6458
                QA: da295a16
                Ready: 1faf18b6
                Deployed: c7e2caf4
        priority:
            fieldId: PVTSSF_lAHOAL1A3M4Bc3ZezhXj7k0
            options:
                P0: 3c9a49a0
                P1: a61159a7
                P2: 748c7dc0
        estimate:
            fieldId: PVTF_lAHOAL1A3M4Bc3ZezhXj7k4
    statusFlow:
    - Backlog
    - In progress
    - In review
    - QA
    - Ready
    - Deployed
    labels:
        bug: type:bug
        feature: type:feature
specs:
-   id: fab
    title: Hardening, Rules Knowledge & Coverage Tools
    board: main
    specPath: SPEC.md
    backlogPath: docs/BACKLOG.md
    taskPrefix: FAB
    epics:
    -   id: E3
        title: Player & judge identities
        taskRanges:
        -   - 30
            - 39
        blockedBy: []
    -   id: E0
        title: Quality foundation
        taskRanges:
        -   - 1
            - 9
        blockedBy: []
    -   id: E1
        title: CLI decomposition & UX
        taskRanges:
        -   - 10
            - 19
        blockedBy:
        -   epic: E0
            untilStatus: Deployed
    -   id: E2
        title: Knowledge bases (rules + cards)
        taskRanges:
        -   - 20
            - 29
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: E4
        title: Live follow CLI
        taskRanges:
        -   - 40
            - 49
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: E5
        title: Fabrary analysis
        taskRanges:
        -   - 50
            - 59
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: EI
        title: Infra reserve
        taskRanges:
        -   - 90
            - 99
        blockedBy: []
    invariants:
    - Never answer a Flesh & Blood rules, lore, or card-legality question from model memory or cached agent notes alone — every game-fact claim must cite a source retrieved from the local KB or a live official page at answer time.
    - Card legality (bans, Living Legend rotation) must be re-fetched live from https://fabtcg.com/rules-and-policy-center/card-legality-policy/ every time it is asserted — never served from cache, brain notes, or memory; brain notes may only point at the policy, never enumerate it.
    - Never mix content from other card games (Magic:The Gathering, Pokémon TCG, Yu-Gi-Oh!, One Piece TCG, or any other) into FAB code, KB, brains, or answers.
    - All merge-gating tests must pass with the network disabled; live HTTP happens only behind explicit user commands, never in the gate.
    - Respect upstream services — AppSync GraphQL concurrency ≤4 with retry/backoff (WAF 403s are rate limits, not auth failures — never re-login to fix them); fabtcg.com ≤5 concurrent with browser headers.
    - The CLI must keep running via bin/fab.js + tsx with no build step; `npm i -g . --force` remains the install path.
    - When rules passages do not clearly settle a question, the answer must say so and point to the judge Discord #ask-a-judge channel rather than guess.
    - 'Doubts involving specific cards resolve by consulting the card sources for exact current text (third_party/flesh-and-blood-cards + Card Vault rulings), reviewing the relevant CR rules, and deriving the interaction from text + rules together — never from remembered card text.'
    - 'Knowledge flows one way between the advisory brains: the JUDGE brain is the source of truth for rules/keyword knowledge; the player asks the judge when in doubt; the judge, when in doubt, consults the official documents and updates its own notes; the judge NEVER learns from the player — player suggestions enter the judge brain only after confirmation against the real documents.'
    - 'Vendored knowledge submodules (third_party/fablore, third_party/flesh-and-blood-cards) and the rules KB must be kept regularly up to date: refresh before use when older than their TTL (24h default), commit pin bumps; stale vendored data must never silently answer a freshness-sensitive question.'
-   id: price
    title: Marketplace price comparison
    board: main
    specPath: SPEC-PRICE.md
    backlogPath: docs/BACKLOG-PRICE.md
    taskPrefix: PRICE
    epics:
    -   id: E0
        title: 'Foundations: providers & clients'
        taskRanges:
        -   - 1
            - 9
        blockedBy: []
    -   id: E1
        title: Comparison engine + card command
        taskRanges:
        -   - 10
            - 19
        blockedBy:
        -   epic: E0
            untilStatus: Deployed
    -   id: E2
        title: Export + CSV pages
        taskRanges:
        -   - 20
            - 29
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: EI
        title: Infra reserve
        taskRanges:
        -   - 90
            - 99
        blockedBy: []
    invariants:
    - Marketplace access is keyless — never require, store, or ship TCGplayer/Cardmarket API credentials; no auth command exists in the price-comparison namespace.
    - Keep concurrency ≤4 per external host with retry/backoff; a 403 from mp-search-api is rate-limiting/bot protection — degrade to market-price fallback, never hammer or retry-storm.
    - All merge-gating tests run with the network disabled; live HTTP happens only behind explicit user commands.
    - 'Every price cell that is not an exact per-condition value carries a source label saying where it came from (adjacent:<COL>, market, trend, low); no unlabeled fallback number ever reaches output.'
    - Ratio cells are computed only from prices converted to one common currency with a dated ECB rate recorded in the output; never divide raw USD by raw EUR.
    - Never scrape Cloudflare-protected Cardmarket pages or spoof authenticated browser sessions; only public keyless endpoints.
    - Unmatched or unpriced rows are reported (unmatched.csv / summary), never silently dropped.
-   id: talishar
    title: Talishar development aid
    board: main
    specPath: SPEC-TALISHAR.md
    backlogPath: docs/BACKLOG-TALISHAR.md
    taskPrefix: TAL
    epics:
    -   id: E0
        title: Vendoring & fork plumbing
        taskRanges:
        -   - 1
            - 9
        blockedBy: []
    -   id: E1
        title: Architecture doc + talishar brain
        taskRanges:
        -   - 10
            - 19
        blockedBy:
        -   epic: E0
            untilStatus: Deployed
    -   id: E2
        title: Card implementation pipeline
        taskRanges:
        -   - 20
            - 29
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: E3
        title: Latency, bug & DX audit
        taskRanges:
        -   - 30
            - 39
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: EI
        title: Infra reserve
        taskRanges:
        -   - 90
            - 99
        blockedBy: []
    invariants:
    - Never open, mark ready, approve, or merge pull requests on Talishar org repositories; tooling pushes branches only to the user's forks and prepares PR title/body as text — a human creates every upstream PR.
    - In every vendored Talishar clone, `origin` must be the user's fork and `upstream` the Talishar org repo, fetch-only; nothing is ever pushed to `upstream`, and a diverged fork main is reported, never force-pushed.
    - third_party/talishar* clones are gitignored; their contents — especially copyrighted card images — are never committed to fab-cli. Image processing is transient and its outputs go only to branches of the Talishar-side repos.
    - Card behavior implementations are derived from live Card Vault true text plus the-fab-cube stats and the CR at implementation time — never from remembered card text.
    - The talishar brain links to card-vault entities for card/keyword facts and is never added to the keyword-sync MIRRORS list; engine knowledge lives in the talishar brain only.
    - All merge-gating tests pass with the network disabled and without the vendored clones present; running the Talishar docker stack or hitting talishar.net/images.talishar.net is only ever user-invoked, never in the gate.
    - Upstream contributions stay incremental and convention-following (feat:/fix: titles, Summary + Test plan bodies, coordination via the Talishar Discord for large changes); no engine rewrite.
-   id: app
    title: FAB companion app (on-device SLM Q&A, scanning, catalog)
    board: main
    specPath: SPEC-APP.md
    backlogPath: docs/BACKLOG-APP.md
    taskPrefix: APP
    epics:
    -   id: E0
        title: Monorepo restructure
        taskRanges:
        -   - 1
            - 9
        blockedBy: []
    -   id: E1
        title: Corpus -> dataset pipeline
        taskRanges:
        -   - 10
            - 19
        blockedBy:
        -   epic: E0
            untilStatus: Deployed
    -   id: E2
        title: Model training & eval
        taskRanges:
        -   - 20
            - 29
        -   - 80
            - 89
        blockedBy:
        -   epic: E1
            untilStatus: Deployed
    -   id: E3
        title: App foundation & artifact versioning
        taskRanges:
        -   - 30
            - 39
        blockedBy:
        -   epic: E0
            untilStatus: Deployed
    -   id: E4
        title: Q&A experience
        taskRanges:
        -   - 40
            - 49
        blockedBy:
        -   epic: E3
            untilStatus: Deployed
    -   id: E5
        title: Card scanning
        taskRanges:
        -   - 50
            - 59
        blockedBy:
        -   epic: E3
            untilStatus: Deployed
    -   id: E6
        title: Catalog & QR share
        taskRanges:
        -   - 60
            - 69
        blockedBy:
        -   epic: E5
            untilStatus: Deployed
    -   id: EI
        title: Infra reserve
        taskRanges:
        -   - 90
            - 99
        blockedBy: []
    invariants:
    - Every game-fact answer must derive from retrieved corpus chunks; emitted citations must be validated against the actually-retrieved set; when grounding is insufficient the app must abstain and point to the judge Discord #ask-a-judge channel — never emit a parametric guess.
    - Card legality (bans, Living Legend, restricted lists) must never be served from model weights or static indexes as current truth — fetch the live policy when online; when offline, label legality claims as potentially stale with the last-known date.
    - Every shipped artifact (model, embedder, detector, index, registry) must be versioned and pinned via manifests to a corpus snapshot and its compatible peers, with its license identifier recorded; the app must refuse mismatched artifact combinations; knowledge provenance ("knowledge up to") must always be user-visible.
    - Never mix content from any other card game into the corpus, datasets, models, indexes, or answers.
    - The app is offline-first with no accounts and no required server; core Q&A/scan/catalog work with no network; the user's collection never leaves the device except by an explicit user share action, and collection contents are never sent to analytics.
    - No official card images are redistributed inside shipped app binaries or downloadable artifacts; card images load at runtime from official/community CDNs and may be cached. Training-time use of downloaded images on the training host is permitted but images are never committed to git nor shipped.
    - The corpus->dataset->train->quantize->eval->release pipeline must be reproducible from committed manifests (corpus snapshot hash, dataset config, base model hash, hyperparameters, seeds, environment capture, eval scores); no model ships without its manifest.
    - No model or knowledge pack is released without passing the eval gate - trichotomy scoring with asymmetric penalties, near-zero incorrect on adjudication-critical categories, a per-suite minimum-correct coverage floor, OOD rejection suite green, the human-authored adjudication suite green, and (for major versions) a human-audited sample.
    - Every ML component shipped in app binaries or downloadable artifacts must carry a license clean for public App Store distribution (Apache 2.0/MIT preferred); no non-commercial, research-only, or copyleft (GPL/AGPL) weights or code ship. Corpus text ships only in the mode recorded by the redistribution assessment.
    - All merge-gating tests must pass with the network disabled; live HTTP happens only behind explicit user actions or the artifact updater, never in the gate.
commands:
    gate: npm run gate
    gateFast: npm run test:run
    test: npm run test:run
docs:
-   id: root
    path: README.md
    covers:
    - '**'
    notes: user-facing usage + install; update when commands or behavior change
-   id: agent-guide
    path: CLAUDE.md
    covers:
    - '**'
    notes: agent-facing command reference + API/domain knowledge; update when command surface or API behavior changes
delegation:
    identities:
        dev:
        -   name: Dev Agent - {name}
            email: '{local}+dev_agent@{domain}'
            models:
            - claude-sonnet-5
        reviewer:
            name: Reviewer Agent - {name}
            email: '{local}+reviewer_agent@{domain}'
            models:
            - claude-sonnet-5
            - claude-sonnet-5[1m]
        orchestrator:
            name: Orchestrator Agent - {name}
            email: '{local}+orchestrator_agent@{domain}'
        player:
            name: Player Agent - {name}
            email: '{local}+player_agent@{domain}'
        judge:
            name: Judge Agent - {name}
            email: '{local}+judge_agent@{domain}'
        talishar:
            name: Talishar Agent - {name}
            email: '{local}+talishar_agent@{domain}'
paths:
    handoffDir: docs/handoffs
    checkpointFile: .claude/CHECKPOINT
    designDir: docs/design
    specDeltaDir: docs/spec-deltas
    devDoc: docs/DEV.md
methodology:
  entityKinds:
    card: card-vault
    keyword: card-vault
  tdd: true
  maxInProgress: 2
  autoMerge: true
  mergeMethod: squash
  feedback: true
  serialDelivery: true
assistant:
    version: 1
    enabled: true
    names: ["fab-io", "fabio", "fah-byoo"]
    systemPrompt: "You are fab-io (aliases: fabio, fah-byoo — the Brazilian Portuguese pronunciation), the Flesh & Blood TCG specialist assistant for this repository. fab-cli is a CLI for FaB deck/card search and meta analysis (fabrary.net), tournament coverage (fabtcg.com), official Card Vault true text/rulings, and TCGplayer-vs-Cardmarket price comparison. Answer FaB questions (rules, cards, decks, meta, tournaments, lore, prices) using the CLI and vendored knowledge sources, never from unchecked model memory: card text/rulings/legality always come from Card Vault and the live legality page, never a guess; lore is answered only from the vendored fablore archive with source_url citations; hero class/talent/format legality is always resolved from live data. The judge brain is the source of truth for rules/keyword knowledge and never learns from the player."
    llm:
        provider: "claude"
        model: "claude-sonnet-5"
    capabilities:
        claude-code:
            enabled: true
            provisioning:
                bin: "claude"
        codex:
            enabled: false
            provisioning:
                bin: "codex"
    observability:
        metrics:
            prometheus:
                enabled: true
                host: "127.0.0.1"
                port: 9464
        traces:
            sqlite:
                enabled: true
                retainDays: 30
                maxMB: 500
